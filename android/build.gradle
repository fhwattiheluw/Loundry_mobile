allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Gradle 9 menghapus properti `buildDir`. Penggantinya layout.buildDirectory,
// dan bentuk di bawah ini sama dengan template Flutter 3.50.
def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete(rootProject.layout.buildDirectory)
}

// Beberapa plugin Flutter masih mengunci compileSdk lama (file_picker 8 memakai
// 34). AGP 9 menolak itu: sebuah pustaka tidak boleh dipakai oleh modul yang
// compileSdk-nya lebih rendah dari pustaka lain dalam build yang sama. Daripada
// menunggu setiap plugin diperbarui, kita naikkan lantainya untuk semua modul
// Android di build ini. Menaikkan compileSdk hanya membuka API baru; ia tidak
// mengubah targetSdk maupun minSdk, jadi perilaku aplikasi di HP tidak berubah.
subprojects {
    afterEvaluate { proj ->
        if (proj.plugins.hasPlugin("com.android.library")
                || proj.plugins.hasPlugin("com.android.application")) {
            proj.android {
                compileSdk = 36
            }
        }
    }
}
