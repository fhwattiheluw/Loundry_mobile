name: laundry_pos
description: Aplikasi POS untuk UMKM laundry. Offline penuh, cetak nota Bluetooth, notifikasi WhatsApp, laporan pendapatan.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Database lokal
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Format angka dan tanggal Indonesia
  intl: ^0.19.0

  # Printer thermal Bluetooth (ESC/POS)
  print_bluetooth_thermal: ^1.0.9
  esc_pos_utils_plus: ^2.0.3
  permission_handler: ^11.3.1

  # WhatsApp lewat deep link wa.me
  url_launcher: ^6.3.0

  # Iklan
  google_mobile_ads: ^5.1.0

  # Utilitas
  crypto: ^3.0.3
  share_plus: ^9.0.0
  csv: ^6.0.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
