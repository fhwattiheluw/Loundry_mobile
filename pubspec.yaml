name: laundry_pos
description: Aplikasi POS untuk UMKM laundry. Offline penuh, cetak nota Bluetooth, notifikasi WhatsApp, laporan pendapatan.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Database lokal
  sqflite: ^2.3.3
  # SQLite terenkripsi (NFR-05). Dipakai hanya di perangkat, bukan di pengujian.
  sqflite_sqlcipher: ^3.1.0
  flutter_secure_storage: ^9.2.2
  path: ^1.9.0
  path_provider: ^2.1.3

  # Pengiriman WhatsApp lewat Cloud API (FR-67)
  http: ^1.2.2

  # Format angka dan tanggal Indonesia
  intl: ^0.20.2

  # Printer thermal Bluetooth (ESC/POS)
  print_bluetooth_thermal: ^1.0.9
  esc_pos_utils_plus: ^2.0.3
  permission_handler: ^11.3.1

  # WhatsApp lewat deep link wa.me
  url_launcher: ^6.3.0

  # Iklan
  google_mobile_ads: ^9.0.0

  # Pemeriksa koneksi internet
  connectivity_plus: ^6.0.3

  # Utilitas
  crypto: ^3.0.3
  # API SharePlus.instance.share ada sejak 11.0.0. Rentang dibuka
  # sampai sebelum 14 supaya pub bisa mencari yang cocok dengan
  # file_picker, yang sama-sama bergantung pada paket web.
  share_plus: '>=11.0.0 <14.0.0'
  csv: ^6.0.0
  fl_chart: ^0.68.0
  # Memilih berkas backup saat restore
  file_picker: ^8.1.2
  # Ekspor laporan sebagai PDF
  pdf: ^3.11.1
  # Pindai QR nomor nota saat pengambilan
  mobile_scanner: ^5.2.3
  # Logo usaha pada nota
  image_picker: ^1.1.2
  image: '>=3.3.0 <5.0.0'
  # Pengingat backup mingguan. Seri 22 dipilih, bukan 23: seri 23 mewajibkan
  # compileSdk 37, sedangkan android/build.gradle memaku semua modul di 36.
  flutter_local_notifications: ^22.3.3

  material_ui: ^1.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Menjalankan SQLite sungguhan di desktop saat `flutter test`,
  # sehingga kueri laporan diuji apa adanya, bukan dengan tiruan.
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true

  assets:
    # Logo aplikasi, dipakai di layar masuk. Sumber SVG-nya ada di design/.
    - assets/brand/
