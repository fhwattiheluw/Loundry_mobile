name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Analisis dan pengujian
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ambil dependensi
        run: flutter pub get

      - name: Analisis statis
        run: flutter analyze

      - name: Jalankan pengujian
        run: flutter test

  build:
    name: Build APK debug
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Gradle wrapper dan ikon tidak ikut masuk git, jadi diambil dulu.
      - name: Lengkapi berkas platform
        run: bash tool/bootstrap.sh

      - name: Build APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
